<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<title>Being Pellegrino</title>
<meta name="theme-color" content="#E4E5DF">
<style>
/* ── 팔레트 ───────────────────────────────────────────── */
:root{
  --paper:#E4E5DF; --card:#F2F2EC; --ink:#232A31; --ink2:#69737E;
  --rule:#C7C9C0; --gilt:#A3854A; --hold:#8C3B3B;
  --t:#6B7A52;                     /* 시대 색 · 기본 구약 */
  --pad:22px;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
}
[data-t="신약"]{--t:#47677A}
[data-t="현대"]{--t:#7A5C6C}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.6; letter-spacing:-.011em;
  word-break:keep-all; overflow-wrap:break-word;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.wrap{max-width:560px;margin:0 auto;padding:0 24px;padding-left:var(--pad);padding-right:var(--pad)}
.scene{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:44px 0}
.scene[hidden]{display:none}

/* ── 머리표 ───────────────────────────────────────────── */
.eyebrow{
  display:flex;align-items:center;gap:12px;
  font-size:11.5px;letter-spacing:.18em;color:var(--ink2);
  text-transform:uppercase;margin-bottom:26px;
}
.eyebrow .era{color:var(--t);font-weight:700;letter-spacing:.24em}
.eyebrow .ln{flex:1;height:1px;background:var(--rule)}
.eyebrow .no{font-variant-numeric:tabular-nums;color:var(--gilt);font-weight:600;letter-spacing:.1em}

h1{
  font-size:29px; line-height:1.28; font-weight:800;
  letter-spacing:-.03em; margin-bottom:22px;
}
.story{font-size:16.2px;line-height:1.92;color:#333C45}
.ref{
  font-size:12px;letter-spacing:.02em;color:var(--ink2);
  margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)
}

/* ── 선택 ─────────────────────────────────────────────── */
.choices{margin-top:34px}
.choices .pick+.pick{margin-top:12px}
.pick{
  display:block;width:100%;text-align:left;cursor:pointer;
  background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--t);
  border-radius:2px;padding:17px 18px;font:inherit;color:inherit;
  transition:transform .16s ease, box-shadow .16s ease, background .16s ease;
}
.pick:hover,.pick:focus-visible{background:#fff;transform:translateY(-1px);box-shadow:0 3px 0 0 rgba(35,42,49,.07)}
.pick:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pick:active{transform:translateY(0)}
.pick .mark{
  font-size:10.5px;letter-spacing:.2em;color:var(--t);font-weight:700;
  display:block;margin-bottom:7px
}
.pick .act{font-size:16.5px;font-weight:700;line-height:1.45;letter-spacing:-.02em}
.pick .cost{
  display:block;margin-top:10px;padding-top:9px;border-top:1px dashed var(--rule);
  font-size:13px;line-height:1.6;color:var(--ink2)
}
.pick .cost b{font-weight:700;color:var(--ink2);letter-spacing:.08em;font-size:11px}
.hint{margin-top:20px;font-size:12.5px;color:var(--ink2);text-align:center;letter-spacing:.01em}

/* ── 전환 ─────────────────────────────────────────────── */
#s-wait{text-align:center;align-items:center}
#s-wait p{font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.6}
.dot{width:5px;height:5px;border-radius:50%;background:var(--gilt);margin:22px auto 0;animation:bl 1.1s infinite}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}

/* ── 결과 ─────────────────────────────────────────────── */
.rec-top{margin-bottom:30px}
.rec-top .sub{font-size:11.5px;letter-spacing:.22em;color:var(--gilt);font-weight:600;margin-bottom:8px}
.rec-top h2{font-size:23px;font-weight:800;letter-spacing:-.028em}
.chosen{
  background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--t);
  border-radius:2px;padding:15px 17px;margin-bottom:34px
}
.chosen .mark{font-size:10.5px;letter-spacing:.2em;color:var(--t);font-weight:700;display:block;margin-bottom:6px}
.chosen .act{font-size:15.5px;font-weight:700;line-height:1.5;letter-spacing:-.02em}
.chosen .cost{margin-top:9px;font-size:12.5px;line-height:1.6;color:var(--ink2)}

.blk{margin-bottom:34px}
.blk>.sub{font-size:11.5px;letter-spacing:.22em;color:var(--gilt);font-weight:600;margin-bottom:7px}
.blk>h2{font-size:22px;font-weight:800;letter-spacing:-.028em;margin-bottom:9px}
.blk>.lede{font-size:13.5px;line-height:1.75;color:var(--ink2)}

/* 손익 원장 — 이 화면의 중심 */
.ledger{margin:0 0 34px}
.lg-head{display:flex;align-items:flex-end;padding-bottom:9px;border-bottom:1px solid var(--ink)}
.lg-head .hh{flex:1 1 auto;display:flex;min-width:0}
.lg-head .hh span{flex:1 1 50%;font-size:10.5px;letter-spacing:.2em;color:var(--ink2);font-weight:700}
.lg-head .hh span:first-child{text-align:right;padding-right:7px}
.lg-head .hh span:last-child{padding-left:7px}
.row{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule)}
.sp-nm{width:56px;flex:0 0 56px}
.sp-vl{width:50px;flex:0 0 50px}
.row .nm{width:56px;flex:0 0 56px;padding-right:8px;font-size:14px;font-weight:700;letter-spacing:-.01em}
.row .nm.zero{color:#A6ADB4;font-weight:500}
.track{position:relative;height:17px;flex:1 1 auto;min-width:0}
.track::before{content:"";position:absolute;left:50%;top:-9px;bottom:-9px;width:1px;background:var(--rule)}
.bar{position:absolute;top:1px;height:15px}
.bar.gain{left:50%;background:var(--ink)}
.bar.loss{right:50%;border:1px solid var(--ink);
  background:repeating-linear-gradient(-45deg,transparent 0 3px,rgba(35,42,49,.42) 3px 4.4px)}
.row .vl{width:50px;flex:0 0 50px;padding-left:8px;font-size:13.5px;font-variant-numeric:tabular-nums;text-align:right;font-weight:700;letter-spacing:-.01em}
.row .vl.zero{color:#A6ADB4;font-weight:500}
.lg-note{margin-top:12px;font-size:11.5px;line-height:1.7;color:var(--ink2)}

.ask{border-left:2px solid var(--gilt);padding:2px 0 2px 15px;margin-bottom:26px}
.ask .sub{font-size:10.5px;letter-spacing:.2em;color:var(--gilt);font-weight:700;margin-bottom:7px}
.ask p{font-size:15px;line-height:1.75;font-weight:600;letter-spacing:-.015em}
.close{font-size:13.5px;line-height:1.8;color:var(--ink2);padding-top:20px;border-top:1px solid var(--rule)}

/* ── 안내 화면 ────────────────────────────────────────── */
.mid{text-align:center;align-items:center}
.mid h1{margin-bottom:16px}
.mid p{font-size:14.5px;line-height:1.85;color:var(--ink2);max-width:20em;margin:0 auto}
.hold-mark{
  display:inline-block;font-size:10.5px;letter-spacing:.18em;font-weight:700;
  color:var(--hold);border:1px solid var(--hold);border-radius:2px;padding:5px 11px;margin-bottom:20px
}
details.idx{margin-top:44px;border-top:1px solid var(--rule);padding-top:16px;text-align:left}
details.idx summary{font-size:11.5px;letter-spacing:.16em;color:var(--ink2);cursor:pointer;font-weight:600}
details.idx ol{margin-top:14px;padding-left:0;list-style:none}
details.idx a{display:flex;padding:7px 0;color:var(--ink);text-decoration:none;font-size:13px;border-bottom:1px solid var(--rule)}
details.idx a code{margin-right:10px}
details.idx a code{color:var(--gilt);font-variant-numeric:tabular-nums;font-size:11.5px;letter-spacing:.04em;min-width:80px}
details.idx a:hover{color:var(--t)}


@media (min-width:420px){
  :root{--pad:32px}
  h1{font-size:33px}
  .story{font-size:17px}
  .rec-top h2{font-size:25px}
  .blk>h2{font-size:23px}
}
.fade{animation:fi .42s ease both}
@keyframes fi{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>

<!-- 1 · 에피소드 -->
<section class="scene" id="s-ep" hidden><div class="wrap">
  <div class="eyebrow"><span class="era" id="e-era"></span><span class="ln"></span><span class="no" id="e-no"></span></div>
  <h1 id="e-title"></h1>
  <p class="story" id="e-story"></p>
  <div class="choices">
    <button class="pick" id="e-a" data-c="A">
      <span class="mark">선택 A</span>
      <span class="act" id="e-at"></span>
      <span class="cost"><b>치르는 것</b><br id="e-abr"><span id="e-ac"></span></span>
    </button>
    <button class="pick" id="e-b" data-c="B">
      <span class="mark">선택 B</span>
      <span class="act" id="e-bt"></span>
      <span class="cost"><b>치르는 것</b><br><span id="e-bc"></span></span>
    </button>
  </div>
  <p class="hint">어느 쪽에도 대가가 있습니다. 한 번만 고르십시오.</p>
</div></section>

<!-- 2 · 전환 -->
<section class="scene" id="s-wait" hidden><div class="wrap">
  <p>선택하셨습니다.<br>곧 그 자취를 보여 드립니다.</p>
  <div class="dot"></div>
</div></section>

<!-- 3 · 결과 -->
<section class="scene" id="s-res" hidden><div class="wrap">
  <div class="rec-top">
    <div class="sub">BEING PELLEGRINO</div>
    <h2>당신의 순례 기록</h2>
  </div>
  <div class="chosen">
    <span class="mark" id="r-mark"></span>
    <span class="act" id="r-act"></span>
    <p class="cost" id="r-cost"></p>
  </div>
  <div class="blk">
    <div class="sub">오늘 당신의 걸음</div>
    <h2>여덟 가지 가치</h2>
    <p class="lede">한 번의 선택이 남긴 자취입니다. 더 나은 가치는 없습니다.</p>
  </div>
  <div class="ledger">
    <div class="lg-head"><span class="sp-nm"></span><span class="hh"><span>잃음</span><span>얻음</span></span><span class="sp-vl"></span></div>
    <div id="r-rows"></div>
    <p class="lg-note">빗금은 잃은 만큼, 채운 칸은 얻은 만큼입니다. 한 걸음의 기록이므로 대부분의 값은 0입니다.</p>
  </div>
  <div class="ask">
    <div class="sub">오늘의 나</div>
    <p id="r-q"></p>
  </div>
  <p class="close" id="r-ref"></p>
</div></section>

<!-- 4 · 안내(홈 · 보류 · 없는 편) -->
<section class="scene mid" id="s-info" hidden><div class="wrap">
  <div id="i-hold" hidden><span class="hold-mark">감수 대기 · 게시 보류</span></div>
  <h1 id="i-h"></h1>
  <p id="i-p"></p>
  <details class="idx" id="i-idx"><summary>전체 60편 목록 (준비·리허설용)</summary><ol id="i-list"></ol></details>
</div></section>

<script>
/* ══════════════════════════════════════════════════════════

var HOLD  = ["EP_MD_09","EP_MD_10","EP_MD_11"];   // 감수 대기 · 부스 미노출

var DATA = {"episodes":[{"id":"EP_OT_01","testament":"구약","category":"신앙 vs 사랑","title":"이사악을 바치는 아브라함","story":"100세에 얻은 아들 이사악을 제물로 바치라는 명이 내립니다. 산으로 오르는 길, 아들은 '아버지, 번제물은 어디 있습니까?'라고 묻습니다. (창세 22,1-19)","a_text":"묵묵히 산으로 오른다","a_cost":"아들의 눈을 마주할 용기를 잠시 잃는다","b_text":"발길을 돌려 아들의 손을 잡는다","b_cost":"'내가 정말 그분을 신뢰했는가'라는 물음이 평생 남는다","question":"오늘의 나: 하느님이 나에게 '가장 소중한 것을 내려놓아라' 하신다면, 나는 무엇을 떠올리게 될까?","reflection":"아브라함의 순명은 맹목이 아니라 '그럼에도 신뢰함'이었다."},{"id":"EP_OT_02","testament":"구약","category":"자유 vs 지혜","title":"에덴동산의 선악과","story":"'선악과를 먹으면 하느님처럼 될 것이다.' 뱀의 속삭임이 들립니다. 눈앞의 열매는 아름답고, 지혜롭게 해 줄 것처럼 보입니다. (창세 3,1-7)","a_text":"약속을 지키고 열매를 지나친다","a_cost":"'왜 안 되는지'를 끝내 모른 채로 남는다","b_text":"스스로 알고자 열매를 딴다","b_cost":"벌거벗음을 부끄러워하게 되고, 낙원에서 나가야 한다","question":"오늘의 나: '알면 안 되는 것'이 있다고 느낀 순간, 나는 어떻게 반응했는가?","reflection":"자유는 '무엇이든 할 수 있음'이 아니라 '무엇을 선택할지 아는 것'이다."},{"id":"EP_OT_03","testament":"구약","category":"공동체 vs 세속","title":"카인과 아벨","story":"동생 아벨의 제물만 하느님이 받아들이십니다. 얼굴이 굳어진 카인에게 하느님이 말씀하십니다. '죄가 문 앞에 도사리고 있다.' (창세 4,1-16)","a_text":"질투를 인정하고 동생에게 다가간다","a_cost":"'왜 나는 부족한가'라는 열등감을 홀로 감당해야 한다","b_text":"질투를 삼키고 동생을 들로 부른다","b_cost":"형제의 피가 땅에서 나를 부르짖게 된다","question":"오늘의 나: 나보다 잘 되는 친구를 볼 때, 나는 진심으로 축하할 수 있는가?","reflection":"질투는 감정이 아니라 '문 앞의 손님'이다. 들일지 돌려보낼지는 내 몫이다."},{"id":"EP_OT_04","testament":"구약","category":"사명 vs 공동체","title":"노아의 방주","story":"'40일간 비가 내릴 것이다.' 하늘은 맑고, 이웃들은 조롱합니다. 방주는 산 위에 있고, 바다는 보이지 않습니다. (창세 6,13-22)","a_text":"이웃의 비웃음 속에 방주를 짓는다","a_cost":"'너만 옳으냐'는 말에 오래 상처받는다","b_text":"이웃과 어울리며 짓다 만다","b_cost":"심판의 날, 배에 오르지 못한다","question":"오늘의 나: 다들 '그건 시대에 안 맞아'라고 할 때, 나는 내 신념을 지킬 수 있는가?","reflection":"사명은 종종 '고립을 견디는 힘'으로 증명된다."},{"id":"EP_OT_05","testament":"구약","category":"세속 vs 신앙","title":"바벨탑","story":"'꼭대기가 하늘에 닿는 탑을 쌓아 우리 이름을 날리자.' 벽돌은 잘 구워졌고, 기술은 완벽합니다. (창세 11,1-9)","a_text":"탑에서 내려와 흩어진다","a_cost":"'우리가 이룬 것'이 무너지는 상실감을 겪는다","b_text":"탑의 꼭대기까지 올라간다","b_cost":"말이 통하지 않아 함께 살 수 없게 된다","question":"오늘의 나: 나는 '내 이름을 알리는 것'과 '하느님 안에 머무는 것' 중 무엇에 더 시간을 쓰는가?","reflection":"인간의 진보가 하느님을 향하지 않을 때, 그것은 우리를 흩어놓는다."},{"id":"EP_OT_06","testament":"구약","category":"자유 vs 세속","title":"롯의 아내와 소돔","story":"'뒤를 돌아보지 말고 산으로 도망가라.' 도시의 불꽃이 등 뒤에서 타오릅니다. 익숙한 삶, 정든 집이 무너지고 있습니다. (창세 19,15-26)","a_text":"앞만 보고 산으로 달린다","a_cost":"'그동안의 나'와 완전히 결별해야 하는 슬픔이 남는다","b_text":"미련에 뒤를 돌아본다","b_cost":"소금기둥이 되어 그 자리에 굳어버린다","question":"오늘의 나: 나를 힘들게 하는 관계·습관·환경을 떠나야 할 때, 나는 뒤를 돌아보는가?","reflection":"회심은 뒤가 아니라 앞을 보는 것이다."},{"id":"EP_OT_07","testament":"구약","category":"세속 vs 공동체","title":"야곱과 에사우의 장자권","story":"배고파 죽을 것 같은 형이 팥죽 한 그릇을 청합니다. 지금이 장자권을 얻을 유일한 기회입니다. (창세 25,27-34)","a_text":"그릇을 건네고 아무 조건도 걸지 않는다","a_cost":"'평생 형 밑'이라는 위치를 받아들여야 한다","b_text":"장자권을 요구한다","b_cost":"형제의 미움을 사서 20년간 도망 다녀야 한다","question":"오늘의 나: 가족이 어려울 때, 나는 '기회'로 보는가 '함께할 순간'으로 보는가?","reflection":"잔꾀는 잠깐 이기고, 신뢰는 평생을 남긴다."},{"id":"EP_OT_08","testament":"구약","category":"지혜 vs 공동체","title":"요셉의 꿈 이야기","story":"형들이 자신에게 절하는 꿈을 꾸었습니다. 이 특별한 계시를 형들에게 자랑하고 싶습니다. (창세 37,1-11)","a_text":"꿈을 마음에 담아둔다","a_cost":"인정받고 싶은 마음을 오래 참아야 한다","b_text":"꿈을 형들에게 자랑한다","b_cost":"형들의 미움을 사서 노예로 팔려간다","question":"오늘의 나: 나는 SNS에 올리기 전, '이걸 왜 올리고 싶은지' 스스로에게 물어보는가?","reflection":"받은 은사는 자랑거리가 아니라 맡겨진 몫이다."},{"id":"EP_OT_09","testament":"구약","category":"정직 vs 세속","title":"요셉과 보디발의 아내","story":"주인의 아내가 매일 그를 유혹합니다. 거절하면 모함당할 것이고, 응하면 순간의 쾌락과 안전이 있습니다. (창세 39,7-20)","a_text":"겉옷을 벗어두고 도망친다","a_cost":"누명을 쓰고 감옥에 갇힌다","b_text":"유혹에 응한다","b_cost":"하느님 앞에 죄를 짓는다","question":"오늘의 나: '아무도 모른다'는 상황에서, 나는 어떤 사람인가?","reflection":"정직은 아무도 보지 않을 때 드러난다."},{"id":"EP_OT_10","testament":"구약","category":"사명 vs 자유","title":"모세의 소명","story":"떨기나무 불꽃 앞에서 부르심이 들립니다. '내 백성을 이집트에서 이끌어내어라.' 모세는 말합니다. '저는 말주변이 없습니다.' (탈출 3,10월 04일,17)","a_text":"'제가 가겠습니다'라고 답한다","a_cost":"익숙한 미디안의 삶과 완전히 결별한다","b_text":"'저는 부족합니다'라며 물러선다","b_cost":"부르심을 외면했다는 무거움이 평생 남는다","question":"오늘의 나: 하느님이 나에게 '이 일을 해라' 하실 때, 나는 어떤 핑계를 대고 있는가?","reflection":"부르심 앞에서 '자격'이 아니라 '응답'이 문제다."},{"id":"EP_OT_11","testament":"구약","category":"세속 vs 자유","title":"파라오의 완고한 마음","story":"열 가지 재앙이 이집트를 강타합니다. 그러나 파라오는 '내 노동력을 잃을 수 없다'며 히브리인들을 놓아주지 않습니다. (탈출 7-11장)","a_text":"노예들을 놓아준다","a_cost":"이집트 경제의 큰 손실을 감수한다","b_text":"재앙에도 마음을 굳힌다","b_cost":"결국 맏아들과 군대를 모두 잃는다","question":"오늘의 나: 나는 무엇을 붙들고 있느라, 누군가를 자유롭게 놓아주지 못하고 있는가?","reflection":"완고함은 '지키는 것'이 아니라 '잃는 방식'이다."},{"id":"EP_OT_12","testament":"구약","category":"사랑 vs 자유","title":"시어머니를 따르는 룻","story":"남편이 죽었습니다. 시어머니 나오미는 '너는 네 고향으로 돌아가 재혼하라'고 말합니다. 새 인생과 홀로 남을 시어머니 사이입니다. (룻기 1,15-18)","a_text":"'어머니의 백성이 저의 백성입니다'라고 답한다","a_cost":"이방인으로서 낯선 땅에서 밑바닥부터 시작해야 한다","b_text":"고향으로 돌아가 새 삶을 시작한다","b_cost":"시어머니를 홀로 남긴 죄책감이 마음에 남는다","question":"오늘의 나: 나에게 '의무는 없지만 함께해주고 싶은 사람'은 누구인가?","reflection":"사랑은 계약이 아니라 자발적 매임이다."},{"id":"EP_OT_13","testament":"구약","category":"세속 vs 정직","title":"다윗과 밧세바","story":"왕궁 옥상에서 목욕하는 여인이 눈에 들어옵니다. 그녀는 충직한 부하 우리야의 아내입니다. 왕의 권력으로 부를 수 있습니다. (2사무 11,1-27)","a_text":"시선을 돌리고 방으로 들어간다","a_cost":"권력이 있어도 '가질 수 없는 것'이 있음을 인정해야 한다","b_text":"그녀를 왕궁으로 부른다","b_cost":"우리야의 죽음을 지시하고, 예언자의 고발을 받는다","question":"오늘의 나: '내가 가진 힘'을 이용해 무언가를 얻으려 한 적이 있는가?","reflection":"권력은 유혹을 '가능하게' 만들지만, 정당하게 만들지는 않는다."},{"id":"EP_OT_14","testament":"구약","category":"지혜 vs 세속","title":"솔로몬의 청","story":"하느님이 꿈에 나타나 '무엇을 원하느냐' 물으십니다. 부, 장수, 원수의 목숨?무엇이든 청할 수 있습니다. (1열왕 3,5-14)","a_text":"'백성을 다스릴 지혜를 주십시오'라고 청한다","a_cost":"눈에 보이는 안전과 부는 뒤로 밀린다","b_text":"'부와 장수를 주십시오'라고 청한다","b_cost":"지혜 없이 부만 남으면 결국 우상숭배로 흐른다","question":"오늘의 나: 소원 하나가 이루어진다면, 나는 무엇을 청할까? 그리고 그것은 나를 어떤 사람으로 만들까?","reflection":"무엇을 구하는가가 그 사람이 누구인지를 드러낸다."},{"id":"EP_OT_15","testament":"구약","category":"정직 vs 세속","title":"나봇의 포도밭","story":"아합 왕이 이웃 나봇의 포도밭을 탐냅니다. 정당한 값을 제시했지만 나봇은 '조상의 유산'이라며 거절합니다. 왕비 이제벨이 방법을 제안합니다. (1열왕 21,1-16)","a_text":"왕비의 계략을 거절한다","a_cost":"'왕이 원하는 것을 못 얻는' 무력감을 감수한다","b_text":"거짓 증인을 세워 나봇을 처형한다","b_cost":"예언자 엘리야의 심판 선고를 받는다","question":"오늘의 나: 내가 원하는 것을 얻기 위해 누군가를 '수단'으로 삼은 적이 있는가?","reflection":"권력은 원하는 것을 얻는 도구가 아니라 지켜야 할 책임이다."},{"id":"EP_OT_16","testament":"구약","category":"사랑 vs 세속","title":"사렙타 과부의 나눔","story":"가뭄으로 남은 것이라곤 밀가루 한 줌과 기름 조금뿐. 아들과 마지막 빵을 나누려는데 낯선 예언자가 '먼저 나에게 다오'라고 청합니다. (1열왕 17,8-16)","a_text":"예언자에게 먼저 빵을 만들어 준다","a_cost":"아들과 자신의 마지막 끼니를 내려놓는다","b_text":"아들과 마지막 빵을 먹는다","b_cost":"예언자를 통한 하느님의 약속을 놓친다","question":"오늘의 나: 내가 '가진 것이 없다'고 느낄 때조차, 나눌 수 있는 것은 무엇일까?","reflection":"궁핍 속의 나눔은 계산이 아니라 신뢰다."},{"id":"EP_OT_17","testament":"구약","category":"신앙 vs 세속","title":"사자굴 속의 다니엘","story":"왕 외에는 누구에게도 기도하지 말라는 칙령이 내렸습니다. 어기면 사자굴에 던져집니다. 다니엘은 하루 세 번 창문을 열고 기도합니다. (다니 6,2-24)","a_text":"창문을 열고 평소처럼 기도한다","a_cost":"사회적 지위를 잃고 사자굴에 던져진다","b_text":"잠시 기도를 멈추고 위기를 넘긴다","b_cost":"'그때 나는 왜 그랬는가'가 평생 마음에 남는다","question":"오늘의 나: 신앙을 드러내면 손해 볼 것 같은 상황에서, 나는 어떻게 하는가?","reflection":"습관이 된 신앙만이 위기의 순간에도 흔들리지 않는다."},{"id":"EP_OT_18","testament":"구약","category":"신앙 vs 세속","title":"금 신상 앞의 세 친구","story":"느부갓네살 왕이 세운 거대한 금 신상 앞에 모두가 절합니다. 절하지 않으면 불타는 가마에 던져집니다. (다니 3,8-18)","a_text":"'설령 구해주지 않으셔도 절하지 않겠습니다'","a_cost":"불타는 가마에 던져지는 위험을 감수한다","b_text":"잠시 무릎을 굽혔다 일어난다","b_cost":"'나는 무엇 앞에 무릎 꿇었는가'가 평생 남는다","question":"오늘의 나: '이 정도는 괜찮지 않을까'라며 무릎 꿇게 되는 것들이 나에게는 무엇인가?","reflection":"'그럼에도 불구하고'의 신앙만이 참된 신앙이다."},{"id":"EP_OT_19","testament":"구약","category":"사명 vs 자유","title":"에스테르의 결단","story":"'네가 왕비가 된 것이 이 때를 위함인지 누가 아느냐.' 왕 앞에 부름 없이 나가면 죽을 수 있지만, 나가지 않으면 민족이 멸망합니다. (에스 4,13-16)","a_text":"'죽으면 죽으리라' 하고 왕 앞에 나선다","a_cost":"목숨을 걸어야 하는 두려움을 홀로 감당한다","b_text":"왕비의 자리를 지키며 침묵한다","b_cost":"'그때 나서지 않았다면'의 후회가 평생 남는다","question":"오늘의 나: 내가 '지금 이 자리에 있는 이유'는 무엇일까? 그 자리에서 해야 할 말이 있는가?","reflection":"우리가 있는 자리에는 우연이 없다."},{"id":"EP_OT_20","testament":"구약","category":"사명 vs 자유","title":"요나의 도망","story":"'니네베로 가서 회개를 선포하여라.' 부르심을 피해 요나는 정반대 방향의 배에 오릅니다. 폭풍이 몰아칩니다. (요나 1,1-17)","a_text":"'제가 문제입니다'라고 고백하고 바다에 뛰어든다","a_cost":"안전이 사라지고 물고기 뱃속에서 3일을 보낸다","b_text":"배 밑창에서 잠을 청한다","b_cost":"폭풍 속에서 다른 사람들까지 위험에 빠뜨린다","question":"오늘의 나: 내가 '피하고 싶은 부르심'은 무엇인가? 그것은 왜 두려운가?","reflection":"부르심에서 도망치는 배 위에서도, 하느님은 우리를 찾으신다."},{"id":"EP_NT_01","testament":"신약","category":"세속 vs 신앙","title":"부자 청년","story":"'선하신 스승님, 어떻게 하면 영원한 생명을 얻을 수 있습니까?' 예수님이 답하십니다. '가진 것을 팔아 가난한 이들에게 주고, 나를 따라라.' (마태 19,16-22)","a_text":"가진 것을 팔고 예수님을 따른다","a_cost":"오랫동안 쌓아온 안전과 부를 잃는다","b_text":"슬퍼하며 돌아선다","b_cost":"'그때 따라갔다면'의 물음이 평생 남는다","question":"오늘의 나: 예수님을 따르는 데 가장 큰 걸림돌이 되는 '나의 무언가'는 무엇인가?","reflection":"부는 나쁘지 않지만, '내려놓지 못하는 것'은 언제나 우상이다."},{"id":"EP_NT_02","testament":"신약","category":"세속 vs 공동체","title":"되찾은 아들","story":"차남이 아버지에게 미리 유산을 요구합니다. 먼 나라에서 방탕한 생활 후 모든 것을 잃고, 돼지 먹이라도 먹고 싶은 지경이 됩니다. (루카 15,11-24)","a_text":"'아버지, 죄를 지었습니다' 하며 돌아간다","a_cost":"'실패한 나'를 인정하고 얼굴을 들 용기를 내야 한다","b_text":"돼지치기로라도 그곳에 남는다","b_cost":"아버지의 잔치와 회복의 시간을 놓친다","question":"오늘의 나: 나는 '실패한 나'를 얼마나 인정할 수 있는가? 돌아갈 곳은 있는가?","reflection":"돌아가는 데는 자격이 아니라 방향만 필요하다."},{"id":"EP_NT_03","testament":"신약","category":"사랑 vs 세속","title":"착한 사마리아인","story":"예루살렘에서 예리코로 내려가는 길, 강도 만난 사람이 반쯤 죽어 쓰러져 있습니다. 나는 약속에 늦었고, 이 지역은 위험합니다. (루카 10,25-37)","a_text":"가까이 다가가 상처를 싸매고 여관까지 데려간다","a_cost":"시간과 돈, 예정된 일정을 모두 잃는다","b_text":"안타까워하며 길을 지나간다","b_cost":"'이웃'이 누구인지 답하지 못한 채로 남는다","question":"오늘의 나: 나는 누구를 '이웃'이라 부르며, 누구는 '남'이라 부르는가?","reflection":"이웃은 태어나는 것이 아니라, 다가감으로써 되는 것이다."},{"id":"EP_NT_04","testament":"신약","category":"자유 vs 세속","title":"세리 자캐오의 변화","story":"돈은 많지만 죄인으로 낙인찍힌 자캐오. 예수님이 '오늘 네 집에 머물러야겠다' 하십니다. 지금까지의 삶을 바꿀지 선택해야 합니다. (루카 19,1-10)","a_text":"'재산의 반을 나누고 4배로 갚겠습니다'","a_cost":"오랫동안 축적한 부와 안락을 크게 잃는다","b_text":"'다녀가시니 영광입니다'로 예의만 갖춘다","b_cost":"해방의 기회를 놓친다","question":"오늘의 나: 예수님이 '오늘 네 집에 오시겠다' 한다면, 나는 무엇부터 정리하고 싶은가?","reflection":"회심은 감정이 아니라 지갑과 관계에서 드러난다."},{"id":"EP_NT_05","testament":"신약","category":"세속 vs 공동체","title":"어리석은 부자의 비유","story":"풍년으로 곳간이 넘칩니다. '더 크게 지어 여러 해 쓸 것을 쌓아두고, 먹고 마시며 즐기자.' 그러나 그날 밤 하느님이 부르십니다. (루카 12,16-21)","a_text":"곳간을 열어 이웃과 나눈다","a_cost":"'내가 힘들게 모은 것'을 내려놓아야 한다","b_text":"더 큰 곳간을 짓는다","b_cost":"오늘 밤 목숨을 되찾아 갈 때, 준비된 것이 없다","question":"오늘의 나: 내가 '나만을 위해' 쌓아둔 것은 무엇이며, 그것은 얼마나 오래갈까?","reflection":"생명은 소유의 넉넉함에 있지 않다."},{"id":"EP_NT_06","testament":"신약","category":"사랑 vs 세속","title":"향유를 부은 여인","story":"죄인으로 낙인찍힌 여인이 바리사이의 집에 들어와 예수님 발에 향유를 붓고 눈물로 씻습니다. 주위의 시선이 따갑습니다. (루카 7,36-50)","a_text":"손가락질 속에서도 향유를 붓는다","a_cost":"사회적 명예를 잃고 죄인으로 재확인된다","b_text":"문 앞에서 돌아선다","b_cost":"진심으로 감사할 기회를 놓친다","question":"오늘의 나: 나는 신앙적 감정을 '남들이 볼까 봐' 억누른 적이 있는가?","reflection":"많이 용서받은 사람이 많이 사랑한다."},{"id":"EP_NT_07","testament":"신약","category":"정직 vs 세속","title":"빌라도의 재판","story":"예수님의 무죄를 알지만, 민중은 사형을 요구합니다. 판결하지 않으면 로마 황제에게 고발당하고 총독직을 잃을 수 있습니다. (요한 18,28-19,16)","a_text":"'나는 이 사람에게서 아무 죄도 찾지 못하겠다' 선언한다","a_cost":"총독직과 로마의 신임을 잃을 위험을 감수한다","b_text":"손을 씻고 군중에게 넘긴다","b_cost":"'무엇이 진리인가'라는 물음이 역사에 남는다","question":"오늘의 나: 나는 '옳은 줄 알면서도' 다수의 뜻에 따라간 적이 있는가?","reflection":"손을 씻어도 책임은 씻기지 않는다."},{"id":"EP_NT_08","testament":"신약","category":"세속 vs 사랑","title":"유다의 배반","story":"3년간 함께 다닌 스승. 그러나 은전 서른 닢의 제안이 들어옵니다. 스승은 세상의 왕이 되지 않을 것 같습니다. (마태 26,14-16)","a_text":"제안을 거절하고 스승 곁에 남는다","a_cost":"'이 길이 맞는가'라는 의심을 감내해야 한다","b_text":"은전을 받고 스승을 넘긴다","b_cost":"돌이킬 수 없는 후회로 스스로 목숨을 끊는다","question":"오늘의 나: 나는 '내가 기대한 예수님'과 '실제 예수님' 사이의 간격을 어떻게 대하는가?","reflection":"실망은 자연스럽지만, 배반으로 이어질 필요는 없다."},{"id":"EP_NT_09","testament":"신약","category":"신앙 vs 자유","title":"베드로의 부인","story":"스승이 잡히신 뜰, 하녀가 묻습니다. '당신도 저 사람과 함께 있었지요?' 인정하면 잡힐 수 있고, 부인하면 안전합니다. (루카 22,54-62)","a_text":"'네, 저도 그분의 제자입니다'","a_cost":"자신도 붙잡혀 매질을 당할 위험을 감수한다","b_text":"'그 사람을 모릅니다'","b_cost":"닭 우는 소리에 통곡하며 부서진다","question":"오늘의 나: 나는 신앙 때문에 '아니라고 말하는 것'이 두려운 적이 있는가?","reflection":"부인해도 그리스도는 돌아보시고, 그 눈길이 회개의 시작이다."},{"id":"EP_NT_10","testament":"신약","category":"사명 vs 사랑","title":"마리아와 마르타","story":"예수님이 집에 오셨습니다. 마르타는 부엌에서 분주히 상을 차리고, 마리아는 예수님 발치에 앉아 말씀을 듣습니다. 어느 쪽이 옳은가요? (루카 10,38-42)","a_text":"말씀 앞에 머문다","a_cost":"'현실은 누가 챙기나'라는 부담이 남는다","b_text":"부엌으로 가서 상을 차린다","b_cost":"'좋은 몫'을 놓친다","question":"오늘의 나: 나는 봉사를 핑계로 '주님과 함께 있는 시간'을 미루고 있지는 않은가?","reflection":"일보다 먼저 필요한 것은 '주님 발치에 앉는 시간'이다."},{"id":"EP_NT_11","testament":"신약","category":"정직 vs 세속","title":"성전 정화 사건","story":"성전 뜰에서 상인들이 짐승을 팔고 환전을 하며 이득을 챙깁니다. 관행이고, 모두가 그렇게 합니다. (요한 2,13-17)","a_text":"채찍을 만들어 상을 뒤엎는다","a_cost":"종교 지도자들의 미움을 사고, 죽음의 길로 들어선다","b_text":"'관행이니 어쩔 수 없지'라며 지나간다","b_cost":"성전이 장사꾼의 소굴로 남는다","question":"오늘의 나: 나는 '다들 그렇게 하니까'라며 넘어간 부당함이 있는가?","reflection":"거룩한 분노는 사랑의 다른 이름이다."},{"id":"EP_NT_12","testament":"신약","category":"신앙 vs 자유","title":"감옥에서 찬미하는 바오로와 실라","story":"복음을 전하다 매를 맞고 발에 차꼬가 채워진 채 지하 감옥에 갇혔습니다. 밤 12시, 무엇을 하시겠습니까? (사도 16,22-34)","a_text":"찬미가를 부르며 기도한다","a_cost":"고통 속에서 '왜 나만'이라는 원망을 이겨내야 한다","b_text":"'왜 나에게 이런 일이'라며 침묵한다","b_cost":"간수와 그 가족의 회심 기회를 놓친다","question":"오늘의 나: 나는 '어려운 상황'에서 하느님을 원망하는가, 찬미하는가?","reflection":"감옥에서 부르는 찬미가는 감옥의 문을 여는 열쇠가 된다."},{"id":"EP_NT_13","testament":"신약","category":"사명 vs 자유","title":"스테파노의 순교","story":"회당 사람들이 스테파노를 잡아 최고 의회 앞에 세웠습니다. 지금 진리를 말하면 돌에 맞아 죽고, 침묵하면 살 수 있습니다. (사도 6,08월 07일,60)","a_text":"진리를 담대히 선포한다","a_cost":"돌에 맞아 첫 순교자가 된다","b_text":"부드럽게 넘어가려 애쓴다","b_cost":"증언의 순간을 놓친다","question":"오늘의 나: 나는 신앙 때문에 '침묵하지 말아야 할 자리'에서 침묵한 적이 있는가?","reflection":"죽어가면서도 원수를 위해 기도한 스테파노, 그 얼굴은 천사와 같았다."},{"id":"EP_NT_14","testament":"신약","category":"정직 vs 세속","title":"마술사 시몬","story":"사도들이 안수하니 성령이 내리는 것을 봅니다. 그 능력을 돈으로 사려 합니다. '나에게도 그 권능을 파시오.' (사도 8,14-24)","a_text":"'돈으로 살 수 있다 생각한 네 마음을 회개하라'는 말을 받아들인다","a_cost":"'대단한 사람'이라는 지위를 내려놓아야 한다","b_text":"계속 돈으로 영적 능력을 얻으려 한다","b_cost":"은사와 거리가 멀어진다","question":"오늘의 나: 나는 신앙마저 '거래'로 대하고 있지는 않은가?","reflection":"하느님의 선물은 값이 없기에, 값을 매기려는 순간 이미 놓친다."},{"id":"EP_NT_15","testament":"신약","category":"정직 vs 세속","title":"아나니아와 사피라","story":"공동체를 위해 재산을 판 부부. 하지만 일부를 몰래 챙기고 '전부'라고 말합니다. 명예도 얻고 실리도 챙길 수 있습니다. (사도 5,1-11)","a_text":"'일부만 냈습니다'라고 정직하게 말한다","a_cost":"'경건한 사람'이라는 이미지를 잃는다","b_text":"'전부입니다'라고 거짓말한다","b_cost":"공동체 앞에서 쓰러진다","question":"오늘의 나: 나는 신앙 안에서도 '보여주기 위한' 선행을 하고 있지는 않은가?","reflection":"거짓은 사람을 속이는 것이 아니라 성령을 속이려는 시도다."},{"id":"EP_MD_01","testament":"현대","category":"정직 vs 세속","title":"AI가 써준 자기소개서","story":"취업 시즌, 자기소개서 100개를 써야 합니다. AI에 넣으면 30분 만에 그럴싸한 글이 나옵니다. 다들 쓴다고 합니다.","a_text":"AI 참고만 하고 내 말로 다시 쓴다","a_cost":"시간과 체력을 3배 이상 쓴다","b_text":"AI 결과물을 거의 그대로 낸다","b_cost":"'이건 내가 아닌데'라는 위화감이 면접까지 따라온다","question":"오늘의 나: 나는 '결과'만 좋으면 그 과정은 아무래도 좋다고 생각하는가?","reflection":"정직은 '남이 볼 때'가 아니라 '내가 나를 볼 때' 시작된다."},{"id":"EP_MD_02","testament":"현대","category":"사명 vs 세속","title":"스펙 vs 대외활동","story":"여름방학, 대기업 인턴 프로그램과 이주민 청소년 멘토링 봉사가 겹칩니다. 스펙은 이력서에 쓰이고, 봉사는 이력서에 한 줄뿐입니다.","a_text":"봉사에 여름을 쓴다","a_cost":"취업 시장에서 남들보다 뒤처지는 초조함을 감당한다","b_text":"인턴을 선택한다","b_cost":"'그때 그 아이들'을 마음 한켠에 남긴 채로 지나간다","question":"오늘의 나: 나는 이력서에 쓸 수 있는 시간과, 사람에게 쓸 수 있는 시간을 어떻게 배분하는가?","reflection":"이력서에 쓸 수 없는 시간이 사람을 만든다."},{"id":"EP_MD_03","testament":"현대","category":"자유 vs 세속","title":"안정된 직장 vs 하고 싶은 일","story":"부모님이 원하시는 대기업 최종 합격과, 오래 꿈꿔온 작은 문화 스타트업의 제안이 같은 주에 왔습니다. 연봉은 3배 차이.","a_text":"스타트업을 선택한다","a_cost":"안정된 미래와 부모님의 기대를 잠시 밀어놓는다","b_text":"대기업을 선택한다","b_cost":"'하고 싶었던 것'이 조금씩 흐려진다","question":"오늘의 나: 나는 '내가 원하는 삶'과 '남이 인정하는 삶' 중 어느 쪽에 더 무게를 두고 있는가?","reflection":"안정과 자유 중 무엇이 맞다기보다, '내가 왜 그것을 택하는지'가 중요하다."},{"id":"EP_MD_04","testament":"현대","category":"정직 vs 공동체","title":"상사의 부정을 목격했을 때","story":"존경하던 팀장이 회계 자료를 조작하는 것을 우연히 봤습니다. 신고하면 팀장은 해고되고, 팀 분위기는 파괴됩니다. 침묵하면 회사에 손해가 쌓입니다.","a_text":"익명 제보 라인에 신고한다","a_cost":"팀원들의 의심을 받고 관계가 서먹해질 수 있다","b_text":"못 본 척한다","b_cost":"'나도 공범 아닌가'라는 무거움이 오래 남는다","question":"오늘의 나: 나는 '조직의 평화'와 '진실' 중 어느 쪽을 더 두려워하는가?","reflection":"침묵이 평화가 아니라 공범이 되는 순간이 있다."},{"id":"EP_MD_05","testament":"현대","category":"공동체 vs 자유","title":"회식 문화","story":"매주 목요일 팀 회식. 술이 강권되고 2차, 3차까지 이어집니다. '요즘 애들'이라는 말은 듣기 싫지만, 매번 참여하기엔 시간과 마음이 지칩니다.","a_text":"1차만 참여하고 정중히 자리를 뜬다","a_cost":"팀 안에서 '개인주의자'라는 낙인을 감수한다","b_text":"매번 끝까지 참여한다","b_cost":"자기 시간과 건강, 신앙생활이 흐트러진다","question":"오늘의 나: 나는 '관계를 지키기 위해' 나를 소진하고 있지는 않은가?","reflection":"공동체는 나를 갈아 넣어야 유지되는 것이 아니다."},{"id":"EP_MD_06","testament":"현대","category":"사랑 vs 사명","title":"유학 vs 부모님 병간호","story":"5년간 준비한 해외 대학원 합격 통지가 왔습니다. 같은 달, 어머니의 암 진단을 받았습니다. 형제자매는 없습니다.","a_text":"유학을 미루고 어머니 곁에 남는다","a_cost":"꿈과 커리어가 몇 년 뒤로 밀린다","b_text":"유학을 떠나고 원격으로 지원한다","b_cost":"'그때 함께 있었어야 하지 않았나'가 평생 남는다","question":"오늘의 나: 나는 '가족의 시간'과 '나의 시간'을 어떻게 저울질하는가?","reflection":"정답이 없는 갈림길에서, 우리는 '남을 죄를 안고 걸을 뿐'이다."},{"id":"EP_MD_07","testament":"현대","category":"사랑 vs 세속","title":"데이팅 앱의 유혹","story":"신앙을 나눌 사람을 만나기 어렵습니다. 데이팅 앱에는 매력적인 프로필이 많고, 스와이프 한 번이면 대화가 시작됩니다.","a_text":"본당·성서모임 등 신앙 공동체에서 관계를 찾는다","a_cost":"시간이 오래 걸리고 선택지가 좁다는 답답함이 있다","b_text":"데이팅 앱을 계속 사용한다","b_cost":"'스와이프되는 존재'라는 자기 감각이 마음을 갉아먹는다","question":"오늘의 나: 나는 '사랑받고 싶다'는 마음과 '소비되고 싶지 않다'는 마음 사이 어디에 있는가?","reflection":"사랑은 편리와 정반대 방향에 있다."},{"id":"EP_MD_08","testament":"현대","category":"사명 vs 자유","title":"결혼 vs 성소","story":"5년째 만난 사람과 결혼 이야기가 오갑니다. 그러나 마음 한 켠에는 '수도 성소'에 대한 오랜 부르심의 울림이 있습니다.","a_text":"영적 지도와 성소 식별 과정을 시작한다","a_cost":"현재의 관계에 큰 부담과 상처를 줄 수 있다","b_text":"성소는 접어두고 결혼을 준비한다","b_cost":"'그 부르심은 무엇이었을까'가 오래 남는다","question":"오늘의 나: 내 마음 깊은 곳의 부르심을 나는 얼마나 진지하게 듣고 있는가?","reflection":"성소는 결혼이든 봉헌이든 '더 사랑하는 방식'을 묻는 자리다."},{"id":"EP_MD_12","testament":"현대","category":"정직 vs 세속","title":"SNS 필터 속의 나","story":"필터 없는 셀카는 올릴 자신이 없습니다. 필터를 입힌 나는 예쁘지만, 실제로 만나는 사람들에게 '실물 별로'라는 소리를 들을까 두렵습니다.","a_text":"필터를 걷어낸 사진을 올려본다","a_cost":"좋아요 수가 눈에 띄게 줄어드는 것을 감당한다","b_text":"필터를 계속 사용한다","b_cost":"'진짜 나'와 '온라인의 나' 사이의 거리가 점점 벌어진다","question":"오늘의 나: 나는 온라인과 오프라인에서 얼마나 같은 사람인가?","reflection":"정체성은 필터가 아니라 얼굴을 통해 드러난다."},{"id":"EP_MD_13","testament":"현대","category":"자유 vs 세속","title":"비교의 늪","story":"인스타그램을 열 때마다 친구들의 여행, 승진, 연애 소식이 쏟아집니다. '나만 뒤처지는 것 같다'는 감각이 하루를 무너뜨립니다.","a_text":"SNS 앱을 일주일 삭제한다","a_cost":"소식이 뒤처지는 소외감을 감당한다","b_text":"'다들 저러니 나도 뭔가 올려야지' 하며 계속 본다","b_cost":"비교와 우울이 반복되며 자기 자신에서 멀어진다","question":"오늘의 나: 나는 SNS를 볼 때 '누구'와 나 자신을 비교하고 있는가?","reflection":"비교는 '연결'을 흉내 낸 '고립'이다."},{"id":"EP_MD_14","testament":"현대","category":"신앙 vs 세속","title":"성당 청년모임의 어색함","story":"본당에 청년모임이 있지만, 다들 오래된 친구 사이로 보입니다. 새로 나가면 어색할 것 같고, 신앙도 얕은 것 같아 부끄럽습니다.","a_text":"어색함을 감수하고 한 번 나간다","a_cost":"'낯선 사람 대하는 피로'를 감내한다","b_text":"'다음 기회에'라며 미룬다","b_cost":"점점 신앙이 '혼자만의 것'으로 좁아진다","question":"오늘의 나: 나는 '신앙 공동체'를 필요로 하면서도 왜 그 문을 여는 것을 어려워하는가?","reflection":"신앙은 '혼자'로는 오래 지속되기 어렵다."},{"id":"EP_MD_15","testament":"현대","category":"신앙 vs 세속","title":"고해성사의 문턱","story":"몇 년째 고해성사를 미루고 있습니다. 오래된 죄를 말할 자신이 없고, 신부님이 어떻게 볼까 두렵습니다.","a_text":"이번 주 안에 고해소로 향한다","a_cost":"오래 묻어둔 부끄러움을 마주해야 한다","b_text":"'다음에 하지 뭐' 하고 넘긴다","b_cost":"마음 한 켠의 무거움이 계속 쌓인다","question":"오늘의 나: 나는 왜 '이미 아시는 분' 앞에서 고백하는 것을 두려워하는가?","reflection":"고해는 '벌 받는 자리'가 아니라 '자유를 되찾는 자리'다."},{"id":"EP_MD_16","testament":"현대","category":"공동체 vs 자유","title":"익명 저격 게시글","story":"익명 커뮤니티에 나를 오해한 글이 올라왔습니다. 반박 댓글을 달면 논란이 커지고, 무시하면 오해가 굳어집니다.","a_text":"당사자에게 개인적으로 연락해 대화를 청한다","a_cost":"'왜 내가 먼저?'라는 자존심을 내려놓아야 한다","b_text":"댓글로 강하게 반박한다","b_cost":"싸움이 커지고 진실은 흐려진다","question":"오늘의 나: 나는 '이기고 싶은 마음'과 '오해를 풀고 싶은 마음'을 구분할 수 있는가?","reflection":"진실은 화면에서보다 얼굴에서 더 잘 드러난다."},{"id":"EP_MD_17","testament":"현대","category":"정직 vs 세속","title":"팔로워를 위한 신앙 콘텐츠","story":"가톨릭 인플루언서로 팔로워가 늘고 있습니다. 자극적인 제목과 논쟁적 콘텐츠일수록 조회수가 폭발합니다. 협찬 제안도 들어옵니다.","a_text":"조회수가 낮아도 진솔한 신앙 이야기를 이어간다","a_cost":"계정 성장 속도가 크게 느려진다","b_text":"자극적 콘텐츠 위주로 방향을 바꾼다","b_cost":"'신앙'이 콘텐츠 재료가 되어간다","question":"오늘의 나: 나는 신앙을 '보여주는 것'과 '살아내는 것' 중 어느 쪽에 더 시간을 쓰는가?","reflection":"복음은 알고리즘의 논리로 확산되지 않는다."},{"id":"EP_MD_18","testament":"현대","category":"자유 vs 세속","title":"스마트폰과 함께 잠들기","story":"잠들기 전 30분씩 유튜브 쇼츠를 봅니다. 자고 나면 피곤하고, 아침 기도는 자꾸 미뤄집니다. 이미 습관이 되었습니다.","a_text":"밤 11시 이후 폰을 다른 방에 둔다","a_cost":"잠들기 전 '허전함'을 견뎌야 한다","b_text":"'오늘도 조금만'을 반복한다","b_cost":"시간과 집중력, 아침 기도가 함께 사라진다","question":"오늘의 나: 나는 하루 중 몇 분을 '아무 화면도 없이' 보내고 있는가?","reflection":"자유는 '무엇을 안 할 수 있는가'로도 측정된다."},{"id":"EP_MD_19","testament":"현대","category":"공동체 vs 세속","title":"단톡방의 험담","story":"친구들 단톡방에서 공통의 지인을 험담하는 이야기가 이어집니다. 반응하지 않으면 이상해 보이고, 함께하면 죄책감이 남습니다.","a_text":"'그 얘긴 그만하자'라고 말한다","a_cost":"분위기 깨는 사람으로 여겨질 수 있다","b_text":"'ㅋㅋ' 정도로 웃어넘긴다","b_cost":"'내가 없는 자리에서 나도 그렇게 씹히겠구나'가 남는다","question":"오늘의 나: 나는 자리에 없는 사람을 어떻게 대하는가? 그 사람 앞에서도 같은 말을 할 수 있는가?","reflection":"험담은 우정을 유지하는 방법이 아니라 소진하는 방법이다."},{"id":"EP_MD_20","testament":"현대","category":"세속 vs 지혜","title":"명품과 나","story":"친구들이 하나둘 명품을 사기 시작합니다. 통장 잔고를 보면 무리지만, 카드 할부라면 가능합니다. '나도 하나쯤은'이라는 마음이 자꾸 커집니다.","a_text":"3개월 지켜본 뒤에도 필요하면 사기로 결정한다","a_cost":"'지금 안 사면 뒤처진다'는 조바심을 견뎌야 한다","b_text":"이번 달에 할부로 구매한다","b_cost":"'왜 샀지'가 밀려오고, 통장이 마르며 다음 유혹이 이어진다","question":"오늘의 나: 내가 사고 싶은 것은 '물건'인가, '그 물건이 상징하는 나'인가?","reflection":"소유는 정체성을 잠깐 빌려줄 뿐, 오래 지켜주지 않는다."},{"id":"EP_MD_21","testament":"현대","category":"세속 vs 지혜","title":"코인과 주식의 유혹","story":"친구가 코인으로 큰돈을 벌었다고 자랑합니다. 지금 넣으면 늦지 않을 것 같고, 안 하면 나만 뒤처지는 것 같습니다.","a_text":"감당 가능한 소액만 정하고, 공부부터 시작한다","a_cost":"급등하는 것을 지켜만 봐야 하는 초조함을 감내한다","b_text":"가진 현금 대부분을 넣는다","b_cost":"크게 잃었을 때 회복이 어렵다","question":"오늘의 나: 나는 '빨리 벌고 싶다'는 마음이 나를 어디로 끌고 가는지 살펴보는가?","reflection":"돈은 도구다. 도구가 목적이 되는 순간 나를 사용한다."},{"id":"EP_MD_22","testament":"현대","category":"공동체 vs 세속","title":"헌금과 생활비","story":"이번 달 생활이 빠듯합니다. 그러나 본당에서 이주민 가정 지원 특별 헌금을 요청합니다. 나눔은 하고 싶지만 통장이 걱정입니다.","a_text":"감당 가능한 만큼 정성껏 낸다","a_cost":"이번 달 개인 소비를 눈에 띄게 줄여야 한다","b_text":"'다음에'라며 지나간다","b_cost":"나눔의 기쁨과 감각을 놓친다","question":"오늘의 나: 나눔은 '남는 것'으로 하는 것인가, '몫으로 정한 것'으로 하는 것인가?","reflection":"과부의 두 렙톤은 액수가 아니라 비중이었다."},{"id":"EP_MD_23","testament":"현대","category":"신앙 vs 세속","title":"주일 미사 vs 야근","story":"일요일에도 급한 프로젝트로 회사에서 호출이 왔습니다. 미사에 못 가면 마음이 무겁고, 안 가면 프로젝트가 크게 밀립니다.","a_text":"저녁 미사로 조정하고 팀장에게 시간 확보를 요청한다","a_cost":"'혼자만 유난'이라는 시선을 감수한다","b_text":"미사를 건너뛴다","b_cost":"'또 다음 주'가 반복된다","question":"오늘의 나: 나는 미사를 '해야 하는 의무'로 여기는가, '나를 붙드는 시간'으로 여기는가?","reflection":"주일은 얻는 시간이지 잃는 시간이 아니다."},{"id":"EP_MD_24","testament":"현대","category":"사명 vs 자유","title":"교회 봉사 vs 내 쉼","story":"본당에서 계속 청년회 봉사를 부탁받습니다. 이번엔 정말 지쳤고, 개인 시간이 절실합니다. 그러나 사람이 부족한 것도 사실입니다.","a_text":"'이번엔 쉬겠습니다'라고 정중히 말한다","a_cost":"'신앙심이 부족한 사람'이라는 시선을 감내한다","b_text":"억지로라도 맡는다","b_cost":"봉사가 원망으로 바뀌기 시작한다","question":"오늘의 나: 나는 '봉사'와 '소진' 사이에서 나 자신을 얼마나 돌보고 있는가?","reflection":"쉼도 사명의 일부다. 예수님도 홀로 산으로 물러가셨다."},{"id":"EP_MD_25","testament":"현대","category":"사명 vs 세속","title":"기후 위기와 나의 소비","story":"기후 위기에 관한 회칙 「찬미받으소서」를 읽고 마음이 무거워졌습니다. 그러나 배달, 일회용품, 저가 패션의 편리함을 포기하기는 쉽지 않습니다.","a_text":"'한 달에 3가지'부터 바꾼다","a_cost":"익숙한 편의를 조금씩 내려놓아야 한다","b_text":"'나 하나 바뀐다고 뭐가 달라져'라며 지나간다","b_cost":"무력감이 신앙적 허무로 이어진다","question":"오늘의 나: 나는 '작은 실천'이 아무 소용 없다고 믿고 있는 것은 아닌가?","reflection":"공동의 집을 돌보는 일은 '큰 결심'이 아니라 '작은 습관'에서 시작된다."}],"effects":{"EP_OT_01":{"A":{"신앙":8,"사명":3,"사랑":-9,"공동체":-5},"B":{"사랑":7,"공동체":2,"신앙":-8,"사명":-4}},"EP_OT_02":{"A":{"신앙":6,"정직":3,"지혜":-7,"자유":-5},"B":{"지혜":5,"자유":3,"신앙":-7,"공동체":-4}},"EP_OT_03":{"A":{"공동체":7,"정직":4,"세속":-8,"자유":-5},"B":{"세속":3,"공동체":-8}},"EP_OT_04":{"A":{"사명":7,"신앙":5,"공동체":-9,"세속":-5},"B":{"공동체":3,"세속":2,"사명":-10}},"EP_OT_05":{"A":{"신앙":6,"지혜":3,"세속":-9,"공동체":-5},"B":{"세속":5,"공동체":-8}},"EP_OT_06":{"A":{"자유":7,"신앙":4,"세속":-8,"공동체":-6},"B":{"세속":2,"자유":-10}},"EP_OT_07":{"A":{"공동체":7,"사랑":3,"세속":-8,"자유":-5},"B":{"세속":6,"지혜":2,"공동체":-7}},"EP_OT_08":{"A":{"지혜":6,"공동체":3,"세속":-7,"자유":-5},"B":{"자유":2,"공동체":-9}},"EP_OT_09":{"A":{"정직":8,"신앙":4,"자유":-9,"세속":-6},"B":{"세속":4,"정직":-9}},"EP_OT_10":{"A":{"사명":8,"신앙":5,"자유":-8,"세속":-6},"B":{"자유":3,"사명":-6}},"EP_OT_11":{"A":{"자유":6,"정직":4,"세속":-10,"공동체":-4},"B":{"세속":3,"자유":-10}},"EP_OT_12":{"A":{"사랑":8,"공동체":4,"세속":-8,"자유":-6},"B":{"자유":6,"사랑":-3}},"EP_OT_13":{"A":{"정직":7,"신앙":4,"세속":-8,"자유":-5},"B":{"세속":5,"정직":-10}},"EP_OT_14":{"A":{"지혜":9,"사명":4,"세속":-10,"자유":-4},"B":{"세속":5,"지혜":-6}},"EP_OT_15":{"A":{"정직":8,"신앙":3,"세속":-9,"공동체":-5},"B":{"세속":6,"정직":-10}},"EP_OT_16":{"A":{"사랑":7,"신앙":6,"세속":-9,"자유":-5},"B":{"공동체":3,"신앙":-5}},"EP_OT_17":{"A":{"신앙":9,"정직":5,"세속":-9,"자유":-6},"B":{"세속":4,"신앙":-7}},"EP_OT_18":{"A":{"신앙":9,"정직":5,"세속":-8,"자유":-6},"B":{"세속":4,"공동체":2,"신앙":-6}},"EP_OT_19":{"A":{"사명":9,"사랑":5,"자유":-9,"세속":-6},"B":{"자유":3,"세속":3,"사명":-8}},"EP_OT_20":{"A":{"정직":6,"사명":5,"자유":-9,"세속":-5},"B":{"자유":3,"공동체":-6}},"EP_NT_01":{"A":{"신앙":8,"자유":4,"세속":-10,"공동체":-4},"B":{"세속":5,"신앙":-6}},"EP_NT_02":{ var AXES = ["신앙","사랑","공동체","정직","자유","지혜","사명","세속"];
var SCALE = 10;

var EP = {}; DATA.episodes.forEach(function(e){ EP[e.id] = e; });
var $ = function(id){ return document.getElementById(id); };
function txt(el, s){ el.textContent = s; }

function show(id){
  ["s-ep","s-wait","s-res","s-info"].forEach(function(k){ $(k).hidden = (k !== id); });
  var s = $(id); s.classList.remove("fade"); void s.offsetWidth; s.classList.add("fade");
  window.scrollTo(0,0);
}

function num(id){ var m = /(\d+)$/.exec(id); return m ? m[1] : ""; }

function info(head, body, hold, idx){
  $("i-hold").hidden = !hold;
  txt($("i-h"), head); txt($("i-p"), body);
  $("i-idx").hidden = !(SHOW_INDEX && idx);   /* 목록은 홈에서만 · 방문자 화면에 노출 금지 */
  show("s-info");
}

function buildIndex(){
  var ol = $("i-list");
  DATA.episodes.forEach(function(e){
    var li = document.createElement("li"), a = document.createElement("a");
    a.href = "?ep=" + e.id;
    a.innerHTML = "<code>" + e.id + "</code>";
    var sp = document.createElement("span");
    sp.textContent = e.title + (HOLD.indexOf(e.id) > -1 ? " · 보류" : "");
    a.appendChild(sp); li.appendChild(a); ol.appendChild(li);
  });
}

function renderEpisode(e){
  document.body.setAttribute("data-t", e.testament);
  txt($("e-era"), e.testament); txt($("e-no"), num(e.id));
  txt($("e-title"), e.title); txt($("e-story"), e.story);
  txt($("e-at"), e.a_text); txt($("e-ac"), e.a_cost);
  txt($("e-bt"), e.b_text); txt($("e-bc"), e.b_cost);
  show("s-ep");
}

function renderResult(e, c){
  var sc = (DATA.effects[e.id] || {})[c] || {};
  txt($("r-mark"), "선택한 길 · " + c);
  txt($("r-act"), c === "A" ? e.a_text : e.b_text);
  txt($("r-cost"), c === "A" ? e.a_cost : e.b_cost);

  var box = $("r-rows"); box.innerHTML = "";
  AXES.forEach(function(ax){
    var v = sc[ax] || 0, pct = Math.min(Math.abs(v) / SCALE, 1) * 50;
    var row = document.createElement("div"); row.className = "row";
    var z = v === 0 ? " zero" : "";
    row.innerHTML =
      '<span class="nm' + z + '">' + ax + '</span>' +
      '<span class="track">' + (v === 0 ? "" :
        '<span class="bar ' + (v > 0 ? "gain" : "loss") + '" style="width:' + pct + '%"></span>') + '</span>' +
      '<span class="vl' + z + '">' + (v > 0 ? "+" + v : v) + '</span>';
    row.setAttribute("aria-label", ax + " " + (v > 0 ? "얻음 " + v : v < 0 ? "잃음 " + Math.abs(v) : "변화 없음"));
    box.appendChild(row);
  });

  txt($("r-q"), e.question.replace(/^오늘의 나\s*:\s*/, ""));
  txt($("r-ref"), e.reflection);
  show("s-res");
}

function start(){
  if (SHOW_INDEX) buildIndex();

  var id = new URLSearchParams(location.search).get("ep");

  if (!id) {
    info("당신은 어떤 순례자입니까?",
         "성경 속 인물들과 오늘의 순례자들이 걸어간 길. 그 안에서 당신의 걸음을 만나보세요. 포스터의 QR을 찍으면 한 편이 열립니다.", false, true);
    return;
  }
  id = id.trim().toUpperCase();
  var e = EP[id];
  if (!e) {
    info("이 편을 찾지 못했습니다",
         "포스터의 QR을 다시 찍어 주십시오. 계속 같은 화면이 나오면 부스 안내자에게 말씀해 주십시오.", false, false);
    return;
  }
  if (HOLD.indexOf(id) > -1) {
    info("아직 열리지 않은 편입니다",
         "이 편은 검토 중입니다. 다른 포스터의 QR을 찍어 주십시오.", true, false);
    return;
  }

  renderEpisode(e);
  var lock = false;
  ["e-a","e-b"].forEach(function(k){
    $(k).addEventListener("click", function(){
      if (lock) return; lock = true;                 /* 단방향 순례 · 재선택 없음 */
      var c = this.getAttribute("data-c");
      show("s-wait");
      setTimeout(function(){ renderResult(e, c); }, 1400);
    });
  });
}
start();
