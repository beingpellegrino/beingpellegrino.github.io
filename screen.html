<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Being Pellegrino — 오늘 이 방의 걸음</title>
<style>
:root{
  --paper:#EDE5D6; --card:#F7F1E6; --ink:#2E2119; --ink2:#7A6A5C;
  --rule:#D5C9B5; --gilt:#9A7B4F;
  --ot:#B5622F; --nt:#3B6E8F; --md:#5B5F8C;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:clamp(11px,.95vw + .4vh,23px)}
body{
  background:var(--paper);color:var(--ink);font-family:var(--sans);
  height:100vh;overflow:hidden;padding:1.6rem 2.2rem 1.2rem;
  display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
}

/* ── 머리 ── */
header{display:flex;align-items:flex-end;padding-bottom:.7rem;border-bottom:2px solid var(--ink)}
header>*{margin-right:1rem}
.mark{font-size:1.3rem;font-weight:800;letter-spacing:.22em}
.sub{font-size:.9rem;letter-spacing:.2em;color:var(--gilt);font-weight:600;padding-bottom:.15rem}
.spacer{flex:1}
.live{display:flex;align-items:center;margin-right:0;font-size:.8rem;letter-spacing:.14em;color:var(--ink2);padding-bottom:.2rem}
.dot{width:.5rem;height:.5rem;margin-right:.45rem;flex:0 0 auto;border-radius:50%;background:var(--ink);animation:pulse 2.6s ease-in-out infinite}
body[data-net="off"] .dot{background:transparent;border:1px solid var(--ink2);animation:none}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

/* ── 원장 ── */
.lede{margin:.9rem 0 .2rem;font-size:1.05rem;color:var(--ink2);line-height:1.6}
.hh{display:flex;align-items:baseline;font-size:.78rem;letter-spacing:.2em;
    color:var(--ink2);font-weight:700;padding:.7rem 0 .35rem;border-bottom:1px solid var(--ink)}
.hh .pad{flex:0 0 7rem}
.hh .a{flex:0 0 5rem;text-align:right;margin-right:.9rem}
.hh .mid{flex:1 1 auto;min-width:0}
.hh .b{flex:0 0 5rem;text-align:left;margin-left:.9rem}
#rows{flex:1 1 auto;display:flex;flex-direction:column;justify-content:space-around;min-height:0}
.row{display:flex;align-items:center;padding:.3rem 0;border-bottom:1px solid var(--rule)}
.nm{flex:0 0 7rem;font-size:1.6rem;font-weight:800;letter-spacing:-.01em}
.vl{flex:0 0 5rem;font-size:1.15rem;font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink2)}
.vl.l{text-align:right;margin-right:.9rem} .vl.r{text-align:left;margin-left:.9rem}
.vl.zero{color:#B3A695;font-weight:500}
.trk{position:relative;height:1.55rem;display:flex;flex:1 1 auto;min-width:0}
.trk::before{content:"";position:absolute;left:50%;top:-.5rem;bottom:-.5rem;width:1px;background:var(--rule)}
.half{flex:0 0 50%;display:flex;height:100%}
.half.l{justify-content:flex-end}
.b{height:100%;width:0;transition:width 1.1s cubic-bezier(.22,.61,.36,1)}
.b.gain{background:var(--ink)}
.b.loss{border:1px solid var(--ink);
        background:repeating-linear-gradient(-45deg,transparent 0 3px,rgba(46,33,25,.42) 3px 4.4px)}

/* ── 발 ── */
footer{display:flex;align-items:flex-end;margin-top:.9rem;padding-top:.8rem;border-top:1px solid var(--ink)}
footer>.blk{margin-right:2.2rem;flex:0 0 auto}
footer>.recent{flex:1 1 auto;min-width:0;margin-right:0}
.blk .cap{font-size:.75rem;letter-spacing:.2em;color:var(--gilt);font-weight:700;margin-bottom:.35rem}
.big{font-size:2.5rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.big small{font-size:.95rem;font-weight:600;color:var(--ink2);margin-left:.3rem;letter-spacing:.08em}
.eras{display:flex;align-items:flex-end}
.era{display:flex;align-items:center;margin-right:1.1rem;font-size:.95rem;font-weight:700}
.era i{margin-right:.4rem} .era span{margin-left:.4rem}
.era i{width:.75rem;height:.75rem;display:block}
.era span{font-variant-numeric:tabular-nums;color:var(--ink2);font-weight:600}
.recent{overflow:hidden}
.recent ul{list-style:none;display:flex;flex-wrap:wrap;max-height:3.1rem;overflow:hidden}
.recent li{font-size:.92rem;color:var(--ink2);white-space:nowrap;
           margin:0 .9rem .3rem 0;padding-left:.7rem;border-left:2px solid var(--rule)}
.recent li:first-child{color:var(--ink);font-weight:700;border-left-color:var(--ink)}

.note{margin-top:.55rem;font-size:.72rem;color:var(--ink2);letter-spacing:.02em;line-height:1.6}
.flag{display:none;margin-left:.6rem;padding:.1rem .5rem;border:1px solid var(--gilt);
      color:var(--gilt);font-size:.68rem;letter-spacing:.16em;font-weight:700;vertical-align:.15rem}
body[data-demo="1"] .flag{display:inline-block}
</style>
</head>
<body data-net="off">

<header>
  <span class="mark">BEING PELLEGRINO</span>
  <span class="sub">더 나은 가치는 없습니다<span class="flag">리허설</span></span>
  <span class="spacer"></span>
  <span class="live"><i class="dot"></i><b id="net">연결하는 중</b></span>
</header>

<p class="lede">이 방을 지나간 사람들이 <b>얻은 것</b>과 <b>잃은 것</b>. 모든 선택에는 둘 다 있습니다.</p>

<div class="hh"><span class="pad"></span><span class="a">잃 음</span><span class="mid"></span><span class="b">얻 음</span></div>
<div id="rows"></div>

<footer>
  <div class="blk">
    <div class="cap">지금까지의 걸음</div>
    <div class="big" id="n">0<small>번의 선택</small></div>
  </div>
  <div class="blk">
    <div class="cap">어느 시대를 만났나</div>
    <div class="eras">
      <span class="era"><i style="background:var(--ot)"></i>구약<span id="e-ot">0</span></span>
      <span class="era"><i style="background:var(--nt)"></i>신약<span id="e-nt">0</span></span>
      <span class="era"><i style="background:var(--md)"></i>현대<span id="e-md">0</span></span>
    </div>
  </div>
  <div class="blk recent">
    <div class="cap">방금 열린 편</div>
    <ul id="last"><li>기다리는 중</li></ul>
  </div>
</footer>

<p class="note">누가 무엇을 골랐는지는 기록하지도, 보여주지도 않습니다. 남는 것은 편 번호와 A·B 뿐입니다.</p>

<script>
/* ══════════════════════════════════════════════════════════════
   설정 — 아래 두 줄만 채우십시오. 비워 두면 화면은 0으로 조용히 대기합니다.
   ══════════════════════════════════════════════════════════════ */
var STAT_URL = "https://script.google.com/macros/s/AKfycbwRt5_xmd6vxbFAaZe6RsLtzGcHTwLJRetaiEcTxgf9NeY14LoJslRmZaNkGEzl0l5APQ/exec";   /* 예: https://script.google.com/macros/s/AKfy.../exec */
var STAT_KEY = "bexco2027pellegrino";   /* Apps Script 의 TOKEN 과 같은 값 */
var SITE     = "./index.html";   /* 8가지 가치 계산표를 여기서 읽어옵니다 */
var EVERY    = 15000;            /* 갱신 주기 (밀리초) */

/* ────────────────────────────────────────────────────────────── */
var AXES = ["신앙","사랑","공동체","정직","자유","지혜","사명","세속"];  /* 순서 고정 · 정렬하지 않는다 */
var ERA  = {OT:"e-ot", NT:"e-nt", MD:"e-md"};
var DEMO = /[?&]demo=1/.test(location.search);
var DATA = null, LAST = null;

if (DEMO) document.body.setAttribute("data-demo","1");

/* ── 계산표 읽기 · index.html 이 유일한 원본이다 ── */
function getText(url){
  if (window.fetch) return fetch(url, {cache:"no-store"}).then(function(r){ return r.text(); });
  return new Promise(function(ok, no){                    /* 구형 브라우저 대비 */
    var x = new XMLHttpRequest();
    x.open("GET", url, true);
    x.onload  = function(){ ok(x.responseText); };
    x.onerror = function(){ no(new Error("net")); };
    x.send();
  });
}

function pullData(){
  return getText(SITE).then(function(src){
    var i = src.indexOf("var DATA = {");
    if (i < 0) throw new Error("DATA 없음");
    var s = src.indexOf("{", i), d = 0, q = null;
    for (var j = s; j < src.length; j++){
      var ch = src.charAt(j);
      if (q){ if (ch === "\\") { j++; continue; } if (ch === q) q = null; continue; }
      if (ch === '"' || ch === "'"){ q = ch; continue; }
      if (ch === "{") d++;
      else if (ch === "}"){ d--; if (!d){ return JSON.parse(src.slice(s, j+1)); } }
    }
    throw new Error("DATA 괄호 불일치");
  });
}

/* ── 서버에 묻기 (JSONP · 부스 네트워크에서 가장 잘 통하는 방식) ── */
var seq = 0;
function pullStat(){
  if (DEMO) { paint(fakeAgg()); return; }
  if (!STAT_URL || !STAT_KEY) { net(false, "주소 미설정"); return; }
  var name = "__bp" + (++seq);
  var s = document.createElement("script");
  var done = false;
  window[name] = function(res){
    done = true;
    if (res && res.ok) { net(true); paint(res); }
    else net(false, res && res.err === "key" ? "열쇠 불일치" : "서버 응답 이상");
    cleanup();
  };
  function cleanup(){
    try{ delete window[name]; }catch(e){ window[name] = undefined; }
    if (s.parentNode) s.parentNode.removeChild(s);
  }
  s.onerror = function(){ net(false, "연결 안 됨"); cleanup(); };
  setTimeout(function(){ if (!done){ net(false, "응답 없음"); cleanup(); } }, 9000);
  s.src = STAT_URL + (STAT_URL.indexOf("?") > -1 ? "&" : "?")
        + "k=" + encodeURIComponent(STAT_KEY) + "&q=agg&cb=" + name + "&_=" + Date.now();
  document.body.appendChild(s);
}

function net(on, why){
  document.body.setAttribute("data-net", on ? "on" : "off");
  document.getElementById("net").textContent =
    on ? (DEMO ? "리허설" : "실시간")
       : (LAST ? "마지막으로 받은 값 · " + why : why || "연결하는 중");
}

/* ── 그리기 ── */
function paint(agg){
  LAST = agg;
  if (!DATA) return;                       /* 계산표를 아직 못 읽었으면 기다린다 */
  var gain = {}, loss = {}, era = {OT:0, NT:0, MD:0};
  AXES.forEach(function(a){ gain[a] = 0; loss[a] = 0; });

  Object.keys(agg.eps || {}).forEach(function(ep){
    var cnt = agg.eps[ep], ef = (DATA.effects || {})[ep];
    if (!ef) return;
    var m = /^EP_(OT|NT|MD)_/.exec(ep);
    if (m) era[m[1]] += (cnt.A || 0) + (cnt.B || 0);
    ["A","B"].forEach(function(c){
      var k = cnt[c] || 0, sc = ef[c] || {};
      if (!k) return;
      AXES.forEach(function(a){
        var v = sc[a] || 0;
        if (v > 0) gain[a] += v * k;
        else if (v < 0) loss[a] += -v * k;
      });
    });
  });

  var max = 1;
  AXES.forEach(function(a){ max = Math.max(max, gain[a], loss[a]); });

  var box = document.getElementById("rows");
  if (box.children.length !== AXES.length){
    box.innerHTML = "";
    AXES.forEach(function(a){
      var r = document.createElement("div"); r.className = "row";
      r.innerHTML =
        '<span class="nm">' + a + '</span>' +
        '<span class="vl l" data-k="l"></span>' +
        '<span class="trk"><span class="half l"><i class="b loss"></i></span>' +
        '<span class="half r"><i class="b gain"></i></span></span>' +
        '<span class="vl r" data-k="g"></span>';
      box.appendChild(r);
    });
  }
  AXES.forEach(function(a, i){
    var r = box.children[i];
    var g = gain[a], l = loss[a];
    r.querySelector('[data-k="g"]').textContent = g ? "+" + fmt(g) : "0";
    r.querySelector('[data-k="l"]').textContent = l ? "−" + fmt(l) : "0";
    r.querySelector('[data-k="g"]').className = "vl r" + (g ? "" : " zero");
    r.querySelector('[data-k="l"]').className = "vl l" + (l ? "" : " zero");
    r.querySelector(".b.gain").style.width = (g / max * 100) + "%";
    r.querySelector(".b.loss").style.width = (l / max * 100) + "%";
  });

  document.getElementById("n").innerHTML = fmt(agg.n || 0) + "<small>번의 선택</small>";
  Object.keys(ERA).forEach(function(k){ document.getElementById(ERA[k]).textContent = fmt(era[k]); });

  var ul = document.getElementById("last"); ul.innerHTML = "";
  var seen = {}, items = (agg.last || []);
  if (!items.length) ul.innerHTML = "<li>아직 없습니다</li>";
  items.forEach(function(ep){
    if (seen[ep]) return; seen[ep] = 1;
    var e = byId(ep); if (!e) return;
    var li = document.createElement("li"); li.textContent = e.title; ul.appendChild(li);
  });
}

function byId(id){
  var list = (DATA && DATA.episodes) || [];
  for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
  return null;
}
function fmt(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

/* ── 리허설용 가짜 데이터 (?demo=1) ── */
var demoState = null;
function fakeAgg(){
  var ids = ((DATA && DATA.episodes) || []).map(function(e){ return e.id; });
  if (!ids.length) return {ok:true, n:0, eps:{}, last:[]};
  if (!demoState) demoState = {eps:{}, n:0, last:[]};
  for (var i = 0; i < 6 + Math.floor(Math.random() * 10); i++){
    var ep = ids[Math.floor(Math.random() * ids.length)];
    var c = Math.random() < .52 ? "A" : "B";
    var o = demoState.eps[ep] || (demoState.eps[ep] = {A:0, B:0});
    o[c]++; demoState.n++;
    demoState.last.unshift(ep); demoState.last = demoState.last.slice(0, 8);
  }
  net(true);
  return {ok:true, n:demoState.n, eps:demoState.eps, last:demoState.last};
}

/* ── 시작 ── */
pullData().then(function(d){
  DATA = d;
  if (LAST) paint(LAST);
  pullStat();          /* 계산표가 늦게 와도 첫 화면이 비지 않게 */
}).catch(function(){
  document.getElementById("net").textContent = "계산표를 읽지 못함";
});
pullStat();
setInterval(pullStat, EVERY);

/* 화면 보호기 방지 · 하루 종일 켜 두는 화면이다 */
setInterval(function(){ window.scrollTo(0, 0); }, 60000);
</script>
</body>
</html>
